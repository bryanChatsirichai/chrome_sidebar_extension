<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shift test</title>
<style>
  html, body { margin: 0; padding: 0; }
  .spacer { height: 4000px; }
  .marker {
    width: 100%;
    height: 80px;
    background: #2d7ff9;
    color: #fff;
    font: 16px sans-serif;
    display: flex;
    align-items: center;
    padding-left: 4px;
  }
  /* fixed element pinned to the left edge */
  .fixed-el {
    position: fixed;
    top: 60px;
    left: 0;
    width: 200px;
    height: 40px;
    background: #f92d2d;
    color: #fff;
    font: 13px sans-serif;
    z-index: 100;
  }
  /* full-viewport fixed top bar (left:0; right:0) */
  .fixed-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: #15a04b;
    color: #fff;
    font: 13px sans-serif;
    z-index: 100;
  }
  /* fixed corner button anchored by right — must NOT move */
  .fixed-corner {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    background: #f9a52d;
    z-index: 100;
  }
  /* fixed centered modal using its own transform */
  .fixed-modal {
    position: fixed;
    top: 40%;
    left: 50%;
    width: 300px;
    height: 200px;
    background: #7a2df9;
    color: #fff;
    z-index: 100;
    transform: translate(-50%, -50%);
  }
  /* app root anchored to the ICB via absolute positioning (YouTube ytd-app
     pattern): the html margin cannot move it — fixedShift must shift it */
  .abs-app-root {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 100%;
    z-index: 99;
    pointer-events: none;
  }
  .abs-app-root .inner-content {
    position: fixed;
    bottom: 90px;
    left: 0;
    width: 160px;
    height: 30px;
    background: #009aa6;
    color: #fff;
    font: 13px sans-serif;
    pointer-events: auto;
  }
  /* absolute element INSIDE a positioned ancestor — must NOT be shifted
     (follows the html margin like in-flow content) */
  .positioned-parent {
    position: relative;
    height: 0;
  }
  .abs-in-flow {
    position: absolute;
    top: 0;
    left: 0;
    width: 90px;
    height: 20px;
    background: #333;
    color: #fff;
    font: 11px sans-serif;
    z-index: 99;
  }
</style>
</head>
<body>
  <div class="fixed-bar" id="fixed-bar">fixed full-width bar</div>
  <div class="fixed-el" id="fixed-el">fixed-el at left:0</div>
  <div class="fixed-corner" id="fixed-corner"></div>
  <div class="fixed-modal" id="fixed-modal">centered modal</div>
  <div class="abs-app-root" id="abs-app-root">
    <div class="inner-content" id="abs-app-content">abs app root</div>
  </div>
  <div class="positioned-parent">
    <div class="abs-in-flow" id="abs-in-flow">abs in positioned parent</div>
  </div>
  <div class="marker" id="marker">PAGE CONTENT at document left edge</div>
  <div class="spacer"></div>
</body>
</html>
